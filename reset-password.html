<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>تغيير كلمة السر — EDARIO</title>
  <link rel="stylesheet" href="links.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="card">
    <div class="logo">EDARIO</div>
    <h1>تغيير كلمة السر</h1>
    <p id="msg">بنفتحلك التطبيق عشان تكتب كلمة السر الجديدة…</p>
    <a class="btn" id="open" href="#">افتح التطبيق</a>
    <p class="hint">لو التطبيق ماتفتحش: افتح الرابط ده من <b>نفس الموبايل</b> اللي طلبت منه تغيير كلمة السر وعليه تطبيق EDARIO.</p>
  </main>
  <script>
    // الرابط اللي جه في الإيميل بيوصل هنا ومعاه `code`. الكود ده مايتحوّلش
    // لجلسة غير على الموبايل اللي طلب التغيير — فبنسلّمه للتطبيق زي ما هو.
    var target = 'edario://reset-password/' + location.search + location.hash;
    document.getElementById('open').href = target;
    if (window.isMobile()) {
      window.openEdarioApp('reset-password');
    } else {
      document.getElementById('msg').textContent =
        'الرابط ده لازم يتفتح من الموبايل اللي عليه تطبيق EDARIO.';
    }
  </script>
</body>
</html>
